name: Windows

# This workflow only exists to build the game without having to clear locally
on: workflow_dispatch

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Build:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks Fthat will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3.3.0

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp 4.2.1 > /dev/null --quiet
          haxelib set hxcpp 4.2.1
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git
          haxelib install colyseus 0.14.10
          haxelib set colyseus 0.14.10
          haxelib list
      - name: Compile
        run: haxelib run lime build Project.xml windows -final
        # If this worked, we could've done --app-version="3.0.0-${{github.sha}}"
      - name: Publish Artifact
        uses: actions/upload-artifact@v3.1.2
        with:
          name: ModBoa Windows
          path: 'export/release/windows/bin'